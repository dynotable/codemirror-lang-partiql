name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert dependencies stay @codemirror/* + the parser only
        run: |
          node -e "const p=require('./package.json'); const bad=Object.keys(p.dependencies||{}).filter(d=>!d.startsWith('@codemirror/')&&d!=='dynamodb-partiql-parser'); if (bad.length) { console.error('unexpected dependencies:', bad); process.exit(1); }"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
